name: Update stock prices

on:
  workflow_dispatch:
  schedule:
    # CRON FIXED 10 Sep 2026. The single hourly entry at minute :07 was being DROPPED by GitHub:
    # on 10 Sep it produced ONE burst all day (12:12-13:00 UTC) against ~15 scheduled triggers, and
    # THE LAST PUBLISH WAS 30 MINUTES BEFORE THE US OPEN AT 13:30 - so every US name on the dashboard
    # showed yesterday's close for the whole session. Actions cron is BEST-EFFORT and minute :07 sits
    # in the most congested window on the platform. Two offset entries now, neither near the hour, so
    # one dropped trigger is no longer a lost hour.
    - cron: "23 7-21 * * 1-5"    # off-peak minute, full trading day (Europe + US)
    - cron: "53 12-20 * * 1-5"   # second chance across the US session, offset by 30 minutes

permissions:
  contents: write
  actions: write   # needed by the keepalive step

concurrency:
  group: update-prices
  cancel-in-progress: false    # CHANGED 10 Sep 2026 - NOT COSMETIC. With two triggers an hour, TRUE
                               # would let the :53 run KILL a healthy :23 burst mid-flight and coverage
                               # would get WORSE, not better. FALSE queues the second run behind the
                               # first so bursts chain back to back. The loop already rebases onto
                               # origin/main, so a queued run picks up cleanly.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Keepalive - prevent GitHub 60-day auto-pause
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/update-prices.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Fetch & commit loop (every ~6 min for the hour)
        shell: bash
        run: |
          set +e
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8 9; do
            echo "=== iteration $i $(date -u) ==="
            python fetch_prices.py || { echo "fetch failed, retry next loop"; sleep 150; continue; }
            # __ONLYPRICES__ 24 Sep 2026. THIS LOOP USED TO REVERT OTHER PEOPLE'S COMMITS. Its conflict
            # fallback was `git reset --soft origin/main` + commit, and a SOFT reset keeps the runner's
            # whole index - including the fetch_prices.py it checked out when the run STARTED. So any
            # change pushed to the repo mid-run was silently undone by the next "update prices" commit.
            # Proven on 24 Sep: commit 79f2248 (price-bot, 20:52:11 UTC) deleted the ENI and ENEL
            # mappings pushed minutes earlier, while claiming only to update prices. The same path could
            # have reverted this workflow file itself.
            # NOW: keep the freshly fetched prices.json aside, HARD-reset to the latest main, put ONLY
            # prices.json back, and commit that one file. A price commit can no longer touch anything
            # else, and there is no rebase left to conflict. Bonus: after the reset the next iteration
            # runs the LATEST fetch_prices.py, so a ticker added mid-run is picked up mid-run.
            cp prices.json "$RUNNER_TEMP/prices.json"
            for a in 1 2 3 4; do
              git fetch origin main -q
              git reset --hard origin/main -q
              cp "$RUNNER_TEMP/prices.json" prices.json
              git add prices.json
              if ! git commit -m "update prices" >/dev/null 2>&1; then echo "no changes"; break; fi
              git push origin HEAD:main -q && break
              echo "push race, retry $a"; sleep $((RANDOM % 5 + 2))
            done
            [ $i -lt 9 ] && sleep 150
          done
          exit 0

      # ==================================================================================
      # __SELFCHAIN__ 24 Sep 2026, owner instruction: "the self-dispatch with a market-hours guard".
      #
      # WHY. The loop above is reliable; the CRON THAT STARTS IT IS NOT. GitHub's scheduler is
      # best-effort and drops most triggers on this repo - on 24 Sep the 13:23 AND 13:53 triggers both
      # never fired, the last run having been created at 12:46. The feed therefore froze at 13:10 UTC,
      # TWENTY MINUTES BEFORE THE US OPEN AT 13:30, so every US name on the dashboard showed yesterday's
      # close AND yesterday's daily move for the whole session. That is the worst possible failure mode
      # because it does not look broken - the numbers are all there, they are simply a day old. The
      # 10 Sep fix (a second cron entry) reduced the odds without removing the dependency, and the same
      # failure recurred two weeks later at almost the same point in the day.
      #
      # WHAT THIS DOES. Each run re-dispatches the workflow when it finishes, so after the FIRST
      # trigger of the day the chain no longer depends on cron at all. A run covers ~25 minutes, so
      # chaining gives continuous coverage. The cron entries stay as the way the chain STARTS (and as
      # the fallback if a link ever breaks).
      #
      # THE GUARD, AND IT MATTERS. Without one this runs all night fetching prices nobody reads and
      # buries the run history. It re-dispatches ONLY Monday-Friday and ONLY between 07:00 and 20:59
      # UTC, which is the existing cron window: European open through the US afternoon. Outside that
      # the chain stops by itself and the next morning's cron restarts it.
      #
      # AND IT WILL NOT PILE UP. If a run is already queued - because cron fired as well - this skips
      # the dispatch rather than adding a second. Combined with `concurrency: cancel-in-progress:false`
      # above, at most one run waits behind the live one.
      #
      # COST: none. lellidavide87/stock-prices is a PUBLIC repo, so Actions minutes are unmetered.
      # TO STOP IT: disable the workflow in the Actions tab; the chain dies with the current run.
      # ==================================================================================
      - name: Re-dispatch (market hours only) - do not depend on GitHub's cron
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DOW=$(date -u +%u)     # 1=Mon .. 7=Sun
          HOUR=$(date -u +%H)
          if [ "$DOW" -gt 5 ]; then
            echo "weekend (UTC day $DOW) - chain stops here, Monday's cron restarts it"; exit 0
          fi
          if [ "$HOUR" -lt 07 ] || [ "$HOUR" -gt 20 ]; then
            echo "outside 07:00-20:59 UTC (now ${HOUR}:00) - chain stops here, tomorrow's cron restarts it"; exit 0
          fi
          QUEUED=$(gh run list --workflow=update-prices.yml --status=queued --json databaseId --jq 'length' || echo 0)
          if [ "${QUEUED:-0}" -gt 0 ]; then
            echo "a run is already queued ($QUEUED) - not adding another"; exit 0
          fi
          echo "re-dispatching: UTC day $DOW, hour $HOUR, nothing queued"
          gh workflow run update-prices.yml --ref main
